<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" font-family="DejaVu Sans, Arial, sans-serif" viewBox="0 0 1200 980"><rect width="1200" height="980" fill="#fff"/><text x="600" y="40" font-size="24" font-weight="bold" text-anchor="middle">Phase 1 A.2 — bench wiring, one wheel node (pin map of 2026-10-22)</text><text x="600" y="66" fill="#555" font-size="14" text-anchor="middle">Wire with the PSU off; switch the motor supply on last. A dot marks a connection; lines never cross.</text><rect width="310" height="390" x="60" y="130" fill="#e8f1fb" stroke="#1d4f91" stroke-width="2.5" rx="10"/><text x="215" y="165" fill="#1d4f91" font-size="18" font-weight="bold" text-anchor="middle">ESP32-C3 Super Mini</text><text x="215" y="186" fill="#555" font-size="12" text-anchor="middle">follow the pin labels printed on the board</text><rect width="60" height="22" x="185" y="108" fill="#bbb" stroke="#555" stroke-width="2" rx="5"/><text x="215" y="98" font-size="13" text-anchor="middle">USB-C to PC (power + console)</text><g font-size="15" text-anchor="end"><text x="360" y="215">GPIO7</text><text x="360" y="265">GPIO5</text><text x="360" y="315">GPIO10</text></g><g font-size="14" text-anchor="middle"><text x="120" y="508">GND</text><text x="190" y="508">GPIO6</text><text x="260" y="508">GPIO20</text><text x="330" y="508">3V3</text></g><rect width="280" height="420" x="520" y="130" fill="#fbe9e9" stroke="#a11d1d" stroke-width="2.5" rx="10"/><text x="660" y="105" fill="#a11d1d" font-size="18" font-weight="bold" text-anchor="middle">DRV8833 module</text><text x="660" y="122" fill="#555" font-size="12" text-anchor="middle">pins top to bottom as on the labeled side</text><g font-size="15"><text x="530" y="165" fill="#999">NC</text><text x="530" y="215">AIN2</text><text x="530" y="265">AIN1</text><text x="530" y="315">STBY</text><text x="530" y="365" fill="#999">BIN1 (open)</text><text x="530" y="415" fill="#999">BIN2 (open)</text><text x="530" y="465" fill="#999">NC</text><text x="530" y="515">GND</text></g><g font-size="15" text-anchor="end"><text x="790" y="165">VM</text><text x="790" y="215" fill="#999">NC</text><text x="790" y="265">GND</text><text x="790" y="315">AO1</text><text x="790" y="365">AO2</text><text x="790" y="415" fill="#999">(open) BO2</text><text x="790" y="465" fill="#999">(open) BO1</text><text x="790" y="515" fill="#999">GND</text></g><g stroke="#555" stroke-width="2"><line x1="500" x2="520" y1="160" y2="160"/><line x1="500" x2="520" y1="210" y2="210"/><line x1="500" x2="520" y1="260" y2="260"/><line x1="500" x2="520" y1="310" y2="310"/><line x1="500" x2="520" y1="360" y2="360"/><line x1="500" x2="520" y1="410" y2="410"/><line x1="500" x2="520" y1="460" y2="460"/><line x1="500" x2="520" y1="510" y2="510"/><line x1="800" x2="820" y1="160" y2="160"/><line x1="800" x2="820" y1="210" y2="210"/><line x1="800" x2="820" y1="260" y2="260"/><line x1="800" x2="820" y1="310" y2="310"/><line x1="800" x2="820" y1="360" y2="360"/><line x1="800" x2="820" y1="410" y2="410"/><line x1="800" x2="820" y1="460" y2="460"/><line x1="800" x2="820" y1="510" y2="510"/></g><g fill="none" stroke-width="3"><line x1="370" x2="500" y1="210" y2="210" stroke="#e07b00"/><line x1="370" x2="500" y1="260" y2="260" stroke="#e07b00"/><line x1="370" x2="500" y1="310" y2="310" stroke="#7b2fbf"/></g><g fill="#555" font-size="12" text-anchor="middle"><text x="435" y="203">PWM</text><text x="435" y="253">PWM</text><text x="435" y="303">sleep / wake</text></g><polyline fill="none" stroke="#222" stroke-width="3" points="500 510 460 510 460 540"/><g stroke="#222" stroke-width="3"><line x1="444" x2="476" y1="540" y2="540"/><line x1="450" x2="470" y1="548" y2="548"/><line x1="456" x2="464" y1="556" y2="556"/></g><text x="460" y="575" fill="#555" font-size="12" text-anchor="middle">GND rail</text><rect width="420" height="70" x="20" y="640" fill="#f3f3f3" stroke="#333" stroke-width="2" rx="8"/><text x="230" y="736" font-size="14" font-weight="bold" text-anchor="middle">spare motor&apos;s 6-wire cable (Dupont ends)</text><g font-size="15" font-weight="bold" text-anchor="middle"><text x="50" y="672">+</text><text x="120" y="672">GND</text><text x="190" y="672">A</text><text x="260" y="672">B</text><text x="330" y="672">V</text><text x="400" y="672">−</text></g><g fill="#444" font-size="11" text-anchor="middle"><text x="50" y="694">red, outer</text><text x="120" y="694">yellow</text><text x="190" y="694">green</text><text x="260" y="694">blue</text><text x="330" y="694">red, inner</text><text x="400" y="694">black</text></g><g fill="none" stroke-width="3"><line x1="120" x2="120" y1="520" y2="640" stroke="#222"/><line x1="190" x2="190" y1="520" y2="640" stroke="#1f9e3a"/><line x1="260" x2="260" y1="520" y2="640" stroke="#1f5fd1"/><line x1="330" x2="330" y1="520" y2="640" stroke="#d11f1f"/></g><g fill="#555" font-size="12"><text x="196" y="600">enc A</text><text x="266" y="600">enc B</text><text x="336" y="580">3.3 V</text><text x="336" y="595">supply</text></g><circle cx="120" cy="585" r="5" fill="#222"/><polyline fill="none" stroke="#222" stroke-width="3" points="120 585 85 585 85 600"/><g stroke="#222" stroke-width="3"><line x1="69" x2="101" y1="600" y2="600"/><line x1="75" x2="95" y1="608" y2="608"/><line x1="81" x2="89" y1="616" y2="616"/></g><text x="70" y="580" fill="#555" font-size="12" text-anchor="middle">GND rail</text><polyline fill="none" stroke="#d11f1f" stroke-width="5" points="50 710 50 790 1000 790 1000 310 820 310"/><polyline fill="none" stroke="#111" stroke-width="5" points="400 710 400 760 920 760 920 360 820 360"/><text x="520" y="782" fill="#d11f1f" font-size="13">motor + → AO1</text><text x="520" y="752" fill="#111" font-size="13">motor − → AO2</text><circle cx="920" cy="620" r="5" fill="#111"/><circle cx="1000" cy="620" r="5" fill="#d11f1f"/><line x1="920" x2="955" y1="620" y2="620" stroke="#555" stroke-width="2.5"/><line x1="965" x2="1000" y1="620" y2="620" stroke="#555" stroke-width="2.5"/><line x1="955" x2="955" y1="604" y2="636" stroke="#555" stroke-width="3"/><line x1="965" x2="965" y1="604" y2="636" stroke="#555" stroke-width="3"/><text x="960" y="655" font-size="13" text-anchor="middle">100 nF</text><text x="960" y="670" fill="#555" font-size="11" text-anchor="middle">ceramic, either way</text><rect width="120" height="170" x="1060" y="120" fill="#fff6dc" stroke="#9a7300" stroke-width="2.5" rx="10"/><text x="1120" y="190" font-size="16" font-weight="bold" text-anchor="middle">Bench PSU</text><text x="1120" y="212" font-size="13" text-anchor="middle">7.4 V</text><text x="1120" y="230" font-size="13" text-anchor="middle">limit 1.5 A</text><text x="1072" y="165" fill="#d11f1f" font-size="16" font-weight="bold">+</text><text x="1072" y="265" font-size="18" font-weight="bold">−</text><line x1="1060" x2="820" y1="160" y2="160" stroke="#d11f1f" stroke-width="5"/><line x1="1060" x2="820" y1="260" y2="260" stroke="#111" stroke-width="5"/><circle cx="900" cy="160" r="5" fill="#d11f1f"/><circle cx="900" cy="260" r="5" fill="#111"/><line x1="900" x2="900" y1="160" y2="203" stroke="#555" stroke-width="2.5"/><line x1="884" x2="916" y1="203" y2="203" stroke="#555" stroke-width="3"/><path fill="none" stroke="#555" stroke-width="3" d="M884,217 Q900,209 916,217"/><line x1="900" x2="900" y1="213" y2="260" stroke="#555" stroke-width="2.5"/><text x="878" y="200" font-size="14" font-weight="bold" text-anchor="end">+</text><text x="925" y="200" font-size="13">470 µF ≥16 V</text><text x="925" y="216" fill="#555" font-size="11">stripe (−) to GND</text><g fill="#333" font-size="13.5"><text x="60" y="880">• Motor current passes one breadboard contact per lead at most: PSU and motor leads go in the same strip as the module pin.</text><text x="60" y="902">• The three &quot;GND rail&quot; points join on the breadboard&apos;s GND rail. The module&apos;s four GND pins are joined on its board (checked 2026-10-22).</text><text x="60" y="924">• Two red wires in the motor cable: outer = motor +, inner = encoder V (3V3 only, never the motor supply).</text><text x="60" y="946">• Leave open: module NC, BIN1/BIN2, BO1/BO2; C3 5V and every GPIO not shown.</text></g><g font-size="12"><line x1="60" x2="90" y1="840" y2="840" stroke="#e07b00" stroke-width="3"/><text x="96" y="844">motor PWM</text><line x1="190" x2="220" y1="840" y2="840" stroke="#7b2fbf" stroke-width="3"/><text x="226" y="844">driver sleep</text><line x1="330" x2="360" y1="840" y2="840" stroke="#1f9e3a" stroke-width="3"/><text x="366" y="844">encoder A</text><line x1="450" x2="480" y1="840" y2="840" stroke="#1f5fd1" stroke-width="3"/><text x="486" y="844">encoder B</text><line x1="570" x2="600" y1="840" y2="840" stroke="#d11f1f" stroke-width="5"/><text x="606" y="844">+ supply</text><line x1="690" x2="720" y1="840" y2="840" stroke="#111" stroke-width="5"/><text x="726" y="844">GND / motor −</text><text x="840" y="844" fill="#555">thick = motor current</text></g></svg>