<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1010" viewBox="0 0 1320 1010" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1320" height="1010" fill="#ffffff"/>
  <text x="660" y="40" font-size="24" font-weight="bold" text-anchor="middle">Phase 2 A — bench wiring, CAN between the gateway and one wheel node</text>
  <text x="660" y="66" font-size="14" text-anchor="middle" fill="#555">Wire with both USB cables unplugged. A dot marks a connection; lines never cross. Pin positions are schematic: follow the printed labels.</text>

  <!-- ===== ESP32-CAM on MB (gateway) ===== -->
  <rect x="40" y="140" width="300" height="370" rx="10" fill="#eef7ee" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="190" y="175" font-size="18" font-weight="bold" text-anchor="middle" fill="#2e7d32">ESP32-CAM on MB board</text>
  <text x="190" y="196" font-size="13" text-anchor="middle" fill="#2e7d32">(gateway)</text>
  <rect x="160" y="118" width="60" height="22" rx="5" fill="#bbb" stroke="#555" stroke-width="2"/>
  <text x="190" y="98" font-size="13" text-anchor="middle">USB-C to PC: /dev/ttyUSB0 (power + console)</text>
  <g font-size="15" text-anchor="end">
    <text x="330" y="235">3V3</text>
    <text x="330" y="285">GND</text>
    <text x="330" y="335">IO13</text>
    <text x="330" y="385">IO14</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="55" y="235">MB male pins;</text>
    <text x="55" y="251">read the names</text>
    <text x="55" y="267">off the board</text>
  </g>
  <g font-size="12" fill="#a11d1d" text-anchor="middle">
    <text x="190" y="430">Seat the module with the camera</text>
    <text x="190" y="446">parallel to the MB's USB-C.</text>
    <text x="190" y="462">The reverse fit = reverse polarity on 5V.</text>
  </g>
  <text x="190" y="497" font-size="14" text-anchor="middle">GND</text>

  <!-- ===== CAN adapter, gateway side ===== -->
  <text x="545" y="140" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4f91">CAN adapter (SN65HVD230)</text>
  <text x="545" y="158" font-size="12" text-anchor="middle" fill="#555">gateway side, labels up</text>
  <rect x="450" y="180" width="160" height="240" rx="8" fill="#e8f1fb" stroke="#1d4f91" stroke-width="2.5"/>
  <g stroke="#555" stroke-width="2">
    <line x1="430" y1="230" x2="450" y2="230"/><line x1="430" y1="280" x2="450" y2="280"/>
    <line x1="430" y1="330" x2="450" y2="330"/><line x1="430" y1="380" x2="450" y2="380"/>
  </g>
  <g font-size="15">
    <text x="460" y="235">3.3V</text>
    <text x="460" y="285">GND</text>
    <text x="460" y="335">RX</text>
    <text x="460" y="385">TX</text>
  </g>
  <rect x="610" y="215" width="40" height="160" rx="4" fill="#3d8fd1" stroke="#1d4f91" stroke-width="2"/>
  <circle cx="630" cy="255" r="10" fill="#cfd8dc" stroke="#333" stroke-width="1.5"/>
  <circle cx="630" cy="345" r="10" fill="#cfd8dc" stroke="#333" stroke-width="1.5"/>
  <g font-size="15" text-anchor="end">
    <text x="600" y="260">CANH</text>
    <text x="600" y="350">CANL</text>
  </g>
  <text x="530" y="401" font-size="11" text-anchor="middle" fill="#555">120 Ω built in</text><text x="530" y="414" font-size="11" text-anchor="middle" fill="#555">(nothing to add)</text>

  <!-- ===== CAN adapter, wheel side (mirrored) ===== -->
  <text x="860" y="140" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d4f91">CAN adapter (SN65HVD230)</text>
  <text x="860" y="158" font-size="12" text-anchor="middle" fill="#555">wheel node side, drawn mirrored</text>
  <rect x="800" y="180" width="160" height="240" rx="8" fill="#e8f1fb" stroke="#1d4f91" stroke-width="2.5"/>
  <g stroke="#555" stroke-width="2">
    <line x1="960" y1="230" x2="980" y2="230"/><line x1="960" y1="280" x2="980" y2="280"/>
    <line x1="960" y1="330" x2="980" y2="330"/><line x1="960" y1="380" x2="980" y2="380"/>
  </g>
  <g font-size="15" text-anchor="end">
    <text x="950" y="235">3.3V</text>
    <text x="950" y="285">GND</text>
    <text x="950" y="335">RX</text>
    <text x="950" y="385">TX</text>
  </g>
  <rect x="760" y="215" width="40" height="160" rx="4" fill="#3d8fd1" stroke="#1d4f91" stroke-width="2"/>
  <circle cx="780" cy="255" r="10" fill="#cfd8dc" stroke="#333" stroke-width="1.5"/>
  <circle cx="780" cy="345" r="10" fill="#cfd8dc" stroke="#333" stroke-width="1.5"/>
  <g font-size="15">
    <text x="810" y="260">CANH</text>
    <text x="810" y="350">CANL</text>
  </g>
  <text x="880" y="401" font-size="11" text-anchor="middle" fill="#555">120 Ω built in</text><text x="880" y="414" font-size="11" text-anchor="middle" fill="#555">(nothing to add)</text>

  <!-- ===== ESP32-C3 Super Mini (wheel node) ===== -->
  <rect x="1070" y="140" width="220" height="370" rx="10" fill="#e8f1fb" stroke="#1d4f91" stroke-width="2.5"/>
  <text x="1180" y="175" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d4f91">ESP32-C3 Super Mini</text>
  <text x="1180" y="196" font-size="13" text-anchor="middle" fill="#1d4f91">(wheel node)</text>
  <rect x="1150" y="118" width="60" height="22" rx="5" fill="#bbb" stroke="#555" stroke-width="2"/>
  <text x="1180" y="98" font-size="13" text-anchor="middle">USB-C to PC: /dev/ttyACM0</text>
  <g font-size="15">
    <text x="1080" y="235">3V3</text>
    <text x="1080" y="285">GND</text>
    <text x="1080" y="335">GPIO3</text>
    <text x="1080" y="385">GPIO4</text>
  </g>
  <g font-size="12" fill="#777" text-anchor="middle">
    <text x="1180" y="425">Phase 1 wiring stays as is:</text>
    <text x="1180" y="441">GPIO5/7/10 → DRV8833,</text>
    <text x="1180" y="457">GPIO6/20 ← encoder</text>
    <text x="1180" y="473">(phase1-a2-wiring.png)</text>
  </g>
  <text x="1180" y="497" font-size="14" text-anchor="middle">GND</text>

  <!-- ===== logic-level wires, gateway ↔ adapter ===== -->
  <g stroke-width="3" fill="none">
    <line x1="340" y1="230" x2="430" y2="230" stroke="#d62728"/>
    <line x1="340" y1="280" x2="430" y2="280" stroke="#222"/>
    <line x1="340" y1="330" x2="430" y2="330" stroke="#1f6fd1"/>
    <line x1="340" y1="380" x2="430" y2="380" stroke="#e07b00"/>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="385" y="223">3.3 V</text>
    <text x="385" y="323">TWAI RX ←</text>
    <text x="385" y="373">TWAI TX →</text>
  </g>

  <!-- ===== logic-level wires, adapter ↔ C3 ===== -->
  <g stroke-width="3" fill="none">
    <line x1="980" y1="230" x2="1070" y2="230" stroke="#d62728"/>
    <line x1="980" y1="280" x2="1070" y2="280" stroke="#222"/>
    <line x1="980" y1="330" x2="1070" y2="330" stroke="#1f6fd1"/>
    <line x1="980" y1="380" x2="1070" y2="380" stroke="#e07b00"/>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="1025" y="223">3.3 V</text>
    <text x="1025" y="323">→ TWAI RX</text>
    <text x="1025" y="373">← TWAI TX</text>
  </g>

  <!-- ===== logic-analyzer probe points ===== -->
  <g fill="#7b3fa0">
    <circle cx="400" cy="330" r="5"/>
    <circle cx="400" cy="380" r="5"/>
    <circle cx="1010" cy="380" r="5"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">
    <rect x="384" y="337" width="32" height="18" rx="4" fill="#7b3fa0"/><text x="400" y="350">D2</text>
    <rect x="384" y="387" width="32" height="18" rx="4" fill="#7b3fa0"/><text x="400" y="400">D0</text>
    <rect x="994" y="387" width="32" height="18" rx="4" fill="#7b3fa0"/><text x="1010" y="400">D1</text>
  </g>

  <!-- ===== CAN bus ===== -->
  <g stroke-width="5" fill="none">
    <line x1="640" y1="255" x2="770" y2="255" stroke="#d4a000"/>
    <line x1="640" y1="345" x2="770" y2="345" stroke="#2a9d3a"/>
  </g>
  <g fill="#333"><circle cx="630" cy="255" r="4"/><circle cx="630" cy="345" r="4"/>
    <circle cx="780" cy="255" r="4"/><circle cx="780" cy="345" r="4"/></g>
  <g font-size="13" text-anchor="middle">
    <text x="705" y="245">CANH</text>
    <text x="705" y="335">CANL</text>
    <text x="705" y="300" fill="#555" font-size="12">CAN bus</text>
  </g>

  <!-- ===== GND between the boards ===== -->
  <g stroke="#222" stroke-width="3" fill="none">
    <polyline points="190,510 190,570 1180,570 1180,510"/>
    <line x1="660" y1="570" x2="660" y2="620"/>
  </g>
  <circle cx="660" cy="570" r="5" fill="#222"/>
  <text x="420" y="562" font-size="12" fill="#555" text-anchor="middle">GND wire between the two boards</text>

  <!-- ===== before power-up ===== -->
  <rect x="450" y="440" width="510" height="100" rx="8" fill="#fff8e1" stroke="#a07800" stroke-width="2"/>
  <text x="705" y="465" font-size="15" font-weight="bold" text-anchor="middle" fill="#7a5c00">Before plugging in USB (A.3)</text>
  <g font-size="13" text-anchor="middle">
    <text x="705" y="490">CANH–CANL ≈ 60 Ω (the two 120 Ω in parallel)</text>
    <text x="705" y="512">3.3V–GND not shorted, on each adapter</text>
  </g>

  <!-- ===== logic analyzer ===== -->
  <rect x="510" y="620" width="300" height="120" rx="10" fill="#f4ecf8" stroke="#7b3fa0" stroke-width="2.5"/>
  <text x="660" y="645" font-size="16" font-weight="bold" text-anchor="middle" fill="#7b3fa0">Logic analyzer (A.4)</text>
  <g font-size="13">
    <text x="530" y="670">D0 → gateway IO14 (TX)</text>
    <text x="530" y="690">D1 → C3 GPIO4 (TX)</text>
    <text x="530" y="710">D2 → gateway IO13 (RX)</text>
    <text x="530" y="730">GND → GND wire (above)</text>
  </g>

  <!-- ===== legend ===== -->
  <g stroke-width="3">
    <line x1="60" y1="790" x2="90" y2="790" stroke="#d62728"/>
    <line x1="200" y1="790" x2="230" y2="790" stroke="#222"/>
    <line x1="310" y1="790" x2="340" y2="790" stroke="#e07b00"/>
    <line x1="460" y1="790" x2="490" y2="790" stroke="#1f6fd1"/>
    <line x1="610" y1="790" x2="640" y2="790" stroke="#d4a000" stroke-width="5"/>
    <line x1="720" y1="790" x2="750" y2="790" stroke="#2a9d3a" stroke-width="5"/>
  </g>
  <circle cx="840" cy="790" r="5" fill="#7b3fa0"/>
  <g font-size="13">
    <text x="96" y="795">3.3 V supply</text>
    <text x="236" y="795">GND</text>
    <text x="346" y="795">TWAI TX</text>
    <text x="496" y="795">TWAI RX</text>
    <text x="646" y="795">CANH</text>
    <text x="756" y="795">CANL</text>
    <text x="852" y="795">analyzer probe</text>
  </g>

  <!-- ===== notes ===== -->
  <g font-size="14">
    <text x="60" y="840">• Adapter TX goes to the MCU's TWAI TX and RX to TWAI RX: straight through, not crossed as on a UART.</text>
    <text x="60" y="865">• Power each adapter from 3V3 only, never a 5V pin: the SN65HVD230 is a 3.3 V part, and at 5 V its RX output would drive the GPIO above 3.3 V.</text>
    <text x="60" y="890">• On the ESP32-CAM, 3V3 sits on the other pin row from IO13/IO14; the drawing groups them. No microSD card in the slot (IO13/IO14 are SD pins).</text>
    <text x="60" y="915">• On the C3, the adapter shares 3V3 and GND with the encoder: use the same breadboard rails.</text>
    <text x="60" y="940">• No 10 kΩ pull-up on the C3's TX: B.4 captured D1 across a C3 reset and it stayed recessive.</text>
    <text x="60" y="965">• Leave open: the ESP32-CAM's 5V / VCC pins and every GPIO not shown.</text>
  </g>
</svg>
