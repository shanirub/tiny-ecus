name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: wheel_node
          - project: gateway
          # can_probe has no target in its sdkconfig.defaults: one build per chip.
          - project: can_probe
            target: esp32
          - project: can_probe
            target: esp32c3
    name: build (${{ matrix.project }}${{ matrix.target && format(', {0}', matrix.target) || '' }})
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.project }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # The checkout is owned by another uid than the container user; without this,
          # `git describe` (used for the app version) fails with "dubious ownership".
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Actions runs steps directly, not through the image's entrypoint, so activate IDF here.
          . "$IDF_PATH/export.sh"
          dir=firmware/${{ matrix.project }}
          if [ -n "$TARGET" ]; then
            idf.py -C "$dir" -B "$dir/build-$TARGET" -D SDKCONFIG="$dir/build-$TARGET/sdkconfig" -D IDF_TARGET="$TARGET" build
          else
            idf.py -C "$dir" build
          fi

  host-tests:
    # Hardware-free logic (test/host), compiled with sanitizers and run on the runner itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run host tests
        run: |
          cmake -S test/host -B build/host -DSANITIZE=ON
          cmake --build build/host
          ctest --test-dir build/host --output-on-failure
      - name: Mutation tests
        # Deliberate bugs in the components; fails if the tests miss any of them.
        run: python3 test/host/mutate.py

  tools-tests:
    # The Python bench tools (tools/), run headless against a fake port.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test requirements
        run: pip install -r tools/requirements-test.txt
      - name: Run tools tests
        run: python -m pytest -q tools/tests
